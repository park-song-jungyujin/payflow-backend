[project]
name = "payflow-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-auth>=2.35",
    "google-cloud-firestore>=2.19",
    "google-cloud-tasks>=2.16",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "openpyxl>=3.1",
    "python-ulid>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
